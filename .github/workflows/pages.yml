# GitHub Pages önizlemesi — kamuya açık sayfaların statik sürümü.
#
# Pages yalnızca statik dosya sunar: yönetim paneli, iletişim formu gönderimi, proxy,
# güvenlik başlıkları (CSP) ve yönlendirmeler bu sürümde YOKTUR. Asıl yayın için
# docs/yayin-kilavuzu.md (Vercel + Supabase). Önizleme arama motorlarına kapalıdır.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Pages ayarları
        id: pages
        uses: actions/configure-pages@v5

      - name: Statik sürüm için kaynakları ayıkla (yalnızca CI kopyasında)
        run: node scripts/pages/prepare.mjs

      - name: Statik derleme
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_SITE_INDEXABLE: "false"

      - name: Çıktıyı Pages'e hazırla
        run: node scripts/pages/finalize.mjs out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
